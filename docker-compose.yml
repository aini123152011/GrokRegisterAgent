# 生产部署：直接拉取 GHCR 镜像。
# 本地源码构建请使用 docker/docker-compose.yml。
#
#   cp .env.example .env
#   docker compose pull
#   docker compose up -d --remove-orphans
#
# 可选 Solver:
#   docker compose --profile solver pull
#   docker compose --profile solver up -d

services:
  grok-register-agent:
    image: aini123152008/grok-register-agent:latest
    container_name: grok-register-agent
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6657}:6657"
      - "127.0.0.1:${TURNSTILE_SOLVER_HOST_PORT:-5072}:5072"
    extra_hosts:
      - "turnstile-solver:127.0.0.1"
    environment:
      PORT: "6657"
      BIND_HOST: "0.0.0.0"
      STATIC_ROOT: "/app/out/renderer"
      DATA_DIR: "/data"
      PYTHON_PATH: "/usr/local/bin/python3"
      REGISTER_DIR: "/app/register"
      REGISTER_HOST_SRC: "/opt/register-host"
      REGISTER_SEED: "/opt/register-seed"
      SSO_DIR: "/data/sso"
      AUTH_QUEUE_DAEMON: "${AUTH_QUEUE_DAEMON:-1}"
      AUTH_QUEUE_DIR: "/data/auth-queue"
      AUTH_QUEUE_WORKERS: "${AUTH_QUEUE_WORKERS:-1}"
      AUTH_QUEUE_MAX_ATTEMPTS: "${AUTH_QUEUE_MAX_ATTEMPTS:-4}"
      OAUTH_PREFLIGHT_CACHE_SEC: "${OAUTH_PREFLIGHT_CACHE_SEC:-45}"
      XAI_OIDC_ISSUER: "${XAI_OIDC_ISSUER:-https://auth.x.ai}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-}"
      MAIL_API_BASE: "${MAIL_API_BASE:-}"
      MAIL_ADMIN_AUTH: "${MAIL_ADMIN_AUTH:-}"
      MAIL_DOMAIN: "${MAIL_DOMAIN:-}"
      REMAIL_PROJECT_ID: "${REMAIL_PROJECT_ID:-}"
      REMAIL_PRODUCT_ID: "${REMAIL_PRODUCT_ID:-}"
      REMAIL_EMAIL_SUFFIXES: "${REMAIL_EMAIL_SUFFIXES:-}"
      RUN_COUNT: "${RUN_COUNT:-10}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      BROWSER_PROXY: "${BROWSER_PROXY:-}"
      BROWSER_PATH: "/usr/bin/chromium"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      DISPLAY: ":99"
      TURNSTILE_SOLVER_ENABLED: "${TURNSTILE_SOLVER_ENABLED:-0}"
      TURNSTILE_SOLVER_URL: "${TURNSTILE_SOLVER_URL:-http://turnstile-solver:5072}"
      TURNSTILE_API_KEY: "${TURNSTILE_API_KEY:-}"
      YESCAPTCHA_KEY: "${YESCAPTCHA_KEY:-}"
    volumes:
      - ./data:/data
    shm_size: "1gb"

  # 可选：Turnstile Solver（默认不拉取/不启动）
  turnstile-solver:
    profiles: ["solver"]
    image: aini123152008/grok-turnstile-solver:latest
    container_name: grok-turnstile-solver
    restart: unless-stopped
    network_mode: "service:grok-register-agent"
    depends_on:
      - grok-register-agent
    environment:
      HOST: "0.0.0.0"
      PORT: "5072"
      THREAD: "${TURNSTILE_SOLVER_THREADS:-2}"
      BROWSER_TYPE: "${TURNSTILE_SOLVER_BROWSER:-chromium}"
      DEBUG: "${TURNSTILE_SOLVER_DEBUG:-0}"
      PROXY: "${TURNSTILE_SOLVER_PROXY:-1}"
      TURNSTILE_API_KEY: "${TURNSTILE_API_KEY:-}"
      TURNSTILE_ADMIN_KEY: "${TURNSTILE_ADMIN_KEY:-}"
      TURNSTILE_ALLOWED_HOSTS: "${TURNSTILE_ALLOWED_HOSTS:-accounts.x.ai}"
      TURNSTILE_QUEUE_SIZE: "${TURNSTILE_QUEUE_SIZE:-16}"
      TURNSTILE_TASK_TIMEOUT: "${TURNSTILE_TASK_TIMEOUT:-90}"
      DISPLAY: ":99"
    shm_size: "1gb"
