name: Docker multi-arch

# Avoid docker/metadata-action (can fail with GitHub Unicorn HTML / API 5xx).
# Tags are set explicitly for GHCR and Docker Hub.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/aini123152011/grok-register-agent
  DH_IMAGE: aini123152008/grok-register-agent
  # 与 scripts/fetch-sing-box.sh 默认一致；升级时改此处即可
  SING_BOX_VERSION: "1.13.14"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker tags
        id: tags
        run: |
          set -euo pipefail
          SHA_SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          GHCR_TAGS="${{ env.GHCR_IMAGE }}:sha-${SHA_SHORT}"
          DH_TAGS="${{ env.DH_IMAGE }}:sha-${SHA_SHORT}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            GHCR_TAGS="${GHCR_TAGS},${{ env.GHCR_IMAGE }}:main,${{ env.GHCR_IMAGE }}:latest"
            DH_TAGS="${DH_TAGS},${{ env.DH_IMAGE }}:main,${{ env.DH_IMAGE }}:latest"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            GHCR_TAGS="${GHCR_TAGS},${{ env.GHCR_IMAGE }}:${VER}"
            DH_TAGS="${DH_TAGS},${{ env.DH_IMAGE }}:${VER}"
            MINOR="$(echo "$VER" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')"
            if [ -n "$MINOR" ] && [ "$MINOR" != "$VER" ]; then
              GHCR_TAGS="${GHCR_TAGS},${{ env.GHCR_IMAGE }}:${MINOR}"
              DH_TAGS="${DH_TAGS},${{ env.DH_IMAGE }}:${MINOR}"
            fi
          else
            BRANCH="$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')"
            GHCR_TAGS="${GHCR_TAGS},${{ env.GHCR_IMAGE }}:${BRANCH}"
            DH_TAGS="${DH_TAGS},${{ env.DH_IMAGE }}:${BRANCH}"
          fi
          echo "ghcr_tags=${GHCR_TAGS}" >> "$GITHUB_OUTPUT"
          echo "dh_tags=${DH_TAGS}" >> "$GITHUB_OUTPUT"
          echo "ghcr_tags=${GHCR_TAGS}"
          echo "dh_tags=${DH_TAGS}"

      - name: Download sing-box (linux-amd64 + linux-arm64)
        run: |
          chmod +x scripts/fetch-sing-box.sh
          ./scripts/fetch-sing-box.sh
          test -x register/bin/sing-box/linux-amd64
          test -x register/bin/sing-box/linux-arm64
          ls -lh register/bin/sing-box/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          build-args: |
            REGISTER_BUILD=${{ github.sha }}
            SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.dh_tags }}
          build-args: |
            REGISTER_BUILD=${{ github.sha }}
            SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
